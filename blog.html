<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>BaloTV Feed</title>

<link rel="stylesheet" href="blog.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<!-- TOPBAR -->

<header class="topbar">

  <div class="topbar-left">

    <!-- MENU -->

    <div class="menu-btn" onclick="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <!-- LOGO -->

    <a href="index.html" class="logo">
      <img src="images/balotv-logo.png" alt="BaloTV">
    </a>

  </div>



  <!-- BUTTONS -->

  <div class="header-actions">

    <button class="header-btn login-btn">
      Login
    </button>

    <button class="header-btn register-btn">
      Register
    </button>

  </div>

  <!-- DROPDOWN -->

  <div class="dropdown-menu" id="dropdownMenu">

    <a href="index.html">Home</a>

    <a href="about.html">Submit Content</a>

    <a href="terms.html">Terms</a>

  </div>

</header>

<main class="feed-container">

<!-- CREATE POST -->

<div class="create-post">

<input
type="text"
id="username"
placeholder="Your name"
>

<textarea
id="content"
placeholder="What's happening on BaloTV?"
></textarea>

<button id="postBtn">
Post
</button>

</div>

<!-- POSTS -->

<div id="posts"></div>

</main>


<script src="blog.js"></script>

</body>



<!-- MOBILE NAV -->

<div class="mobile-nav">

  <button
    class="mobile-nav-btn active"
    onclick="window.location.href='index.html'"
  >
    Home
  </button>

  <button
    class="mobile-nav-btn"
    onclick="window.location.href='library.html'"
  >
    Library
  </button>

  <button
  class="mobile-nav-btn"
  onclick="window.location.href='blog.html'"
>
  Blog
</button>

</div>




</html>
