<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BaloTV</title>
<link rel="stylesheet" href="styles.css">
<script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
<header>
  <div class="logo">BaloTV</div>
  <input type="text" placeholder="Search..." class="search-bar" />
</header>

<section class="hero">
  <div id="g0xtSq2ZcQSQ9wx2" class="main-player"></div>
  <div class="hero-info">
    <h2 id="videoTitle">Welcome to BaloTV</h2>
    <p id="videoTitle">Enjoy the best content curated just for you.</p>
  </div>
</section>

<section class="rows">
  <h3>Continue Watching</h3>
  <div id="row-continue" class="row"></div>

  <h3>Latest Uploads</h3>
  <div id="row-latest" class="row"></div>

  <h3>Talk Shows</h3>
  <div id="row-talk" class="row"></div>

  <h3>Cartoons</h3>
  <div id="row-cartoons" class="row"></div>

  <h3>Music Videos</h3>
  <div id="row-musicvideos" class="row"></div>

  <h3>Music</h3>
  <div id="row-music" class="row"></div>
</section>

<script src="app.js"></script>
</body>
</html>
