<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>BaloTV</title>

<link rel="stylesheet" href="styles.css">

<link rel="manifest" href="manifest.json">

<meta
  name="theme-color"
  content="#ff1a1a"
/>

<link
  rel="apple-touch-icon"
  href="images/icons/icon-192.png"
/>

</head>

<body>

<header class="topbar">

  <div
    class="menu-btn"
    onclick="toggleMenu()"
  >

    <span></span>
    <span></span>
    <span></span>

  </div>

  <div
    class="dropdown-menu"
    id="dropdownMenu"
  >

    <a href="index.html">Home</a>

    <a href="library.html">Library</a>

    <a href="blog.html">Blog</a>

  </div>

  <div class="logo">

    <img
      src="images/balotv-logo.png"
      alt="BaloTV"
    >

  </div>

  <div class="top-right">

    <input
      type="text"
      placeholder="Search..."
      id="searchInput"
    >

  </div>

</header>

<div class="layout">

<main class="content">

<section
  class="player-section hidden"
  id="playerSection"
>

<iframe
  id="video-player"
  src=""
  allowfullscreen
  allow="autoplay"
></iframe>

<div class="player-controls">

<button
  id="prevBtn"
  class="control-btn"
>

⏮ Previous

</button>

<button
  id="nextBtn"
  class="control-btn next"
>

Next ⏭

</button>

</div>

<div class="video-info">

<div class="video-meta">

<div
  class="video-badge live-badge"
>

● NOW PLAYING

</div>

<div class="video-badge">

BaloTV Stream

</div>

</div>

<h1 id="video-title">

Welcome to BaloTV

</h1>

<p id="video-description">

Select any video to start watching.

</p>

</div>

<section class="section">

<div class="section-title">

<h2>Up Next</h2>

</div>

<div
  id="up-next-row"
  class="video-row"
></div>

</section>

</section>

<section
  class="section category-section"
  id="section-home"
>

<h2>Home Videos</h2>

<div
  id="row-home"
  class="video-row"
></div>

</section>

<section
  class="section category-section"
>

<h2>Music Videos</h2>

<div
  id="row-musicvideos"
  class="video-row"
></div>

</section>

<section
  class="section category-section"
>

<h2>Cartoons</h2>

<div
  id="row-cartoons"
  class="video-row"
></div>

</section>

<section
  class="section category-section"
>

<h2>Talk Shows</h2>

<div
  id="row-talk"
  class="video-row"
></div>

</section>

</main>

</div>

<div class="mobile-nav">

<button
  class="mobile-nav-btn active"
>

Home

</button>

<button
  class="mobile-nav-btn"
>

Library

</button>

<button
  class="mobile-nav-btn"
>

Blog

</button>

</div>

<script>

function toggleMenu(){

  document
    .getElementById("dropdownMenu")
    .classList
    .toggle("active");

}

</script>

<script src="app.js"></script>

</body>

</html>
